name: ci
on:
  push:
    branches: [ release, alpha, beta, next-major ]
  pull_request:
    branches:
      - '**'
env:
  NODE_VERSION: 24
jobs:
  check-ci:
    name: Node Engine Check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install prod dependencies
        run: npm ci --ignore-scripts
      - name: Remove dev dependencies
        run: ./ci/uninstallDevDeps.sh @actions/core
      - name: CI Node Engine Check
        run: npm run ci:checkNodeEngine
  check-lint:
    name: Lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - run: npm run lint
  check-circular:
     name: Circular Dependencies
     timeout-minutes: 15
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Scan for circular dependencies
        run: npm run madge:circular
  check-docker:
    strategy:
      matrix:
        include:
          - name: Docker linux/amd64
            DOCKER_PLATFORM: linux/amd64
            CACHE_SCOPE: docker-amd64
            RUNNER_TYPE: ubuntu-latest
          - name: Docker linux/arm64/v8
            DOCKER_PLATFORM: linux/arm64/v8
            CACHE_SCOPE: docker-arm64
            RUNNER_TYPE: ubuntu-latest
      fail-fast: false
    name: ${{ matrix.name }}
    timeout-minutes: 45
    runs-on: ${{ matrix.RUNNER_TYPE }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true
      - name: Build docker image
        uses: docker/build-push-action@v3
        with:
          platforms: ${{ matrix.DOCKER_PLATFORM }}
          cache-from: type=gha,scope=${{ matrix.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ matrix.CACHE_SCOPE }}
  check-lock-file-version:
    name: NPM Lock File Version
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check NPM lock file version
        run: |
          version=$(node -e "console.log(require('./package-lock.json').lockfileVersion)")
          if [ "$version" != "3" ]; then
            echo "::error::Expected lockfileVersion 3, got $version"
            exit 1
          fi
  check-build:
    strategy:
      matrix:
        include:
          - name: Node 20
            NODE_VERSION: 20.19.0
          - name: Node 22
            NODE_VERSION: 22.12.0
          - name: Node 24
            NODE_VERSION: 24.1.0
      fail-fast: false
    name: ${{ matrix.name }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: ${{ matrix.NODE_VERSION }}
    steps:
      - name: Determine major node version
        id: node
        run: |
          node_major=$(echo "${{ matrix.NODE_VERSION }}" | cut -d'.' -f1)
          echo "::set-output name=node_major::$(echo $node_major)"
      - name: Fix usage of insecure GitHub protocol
        run: sudo git config --system url."https://github".insteadOf "git://github"
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Test bundles
        run: ./scripts/before_script.sh
        env:
          CI: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
